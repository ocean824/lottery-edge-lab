[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-edge-lab"
version = "0.1.0"
description = "Research-driven lottery analytics toolkit and executable desktop application with historical ingestion, ranking, charts, and compliance-aware disclaimers."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Manus AI" }
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "matplotlib>=3.8.0",
  "pandas>=2.0.0",
  "requests>=2.31.0"
]

[project.scripts]
lottery-edge = "lottery_edge_lab.cli:main"
lottery-edge-desktop = "lottery_edge_lab.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
